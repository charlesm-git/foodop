info:
  name: Health check
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:8000/health
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.status
      operator: eq
      value: ok

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
