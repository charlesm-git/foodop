info:
  name: Get recipe by id
  type: http
  seq: 4

http:
  method: GET
  url: http://127.0.0.1:8000/recipes/1
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200
    - expression: res.body.id
      operator: eq
      value: 1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
